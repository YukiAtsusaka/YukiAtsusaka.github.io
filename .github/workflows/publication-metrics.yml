name: Refresh publication access metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication-metrics.yml'

permissions:
  contents: write

concurrency:
  group: publication-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/refresh-publication-metrics.test.mjs
      - run: node scripts/refresh-publication-metrics.mjs
      - name: Save verified counts
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- data/publication-metrics.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/publication-metrics.json
            git commit -m 'Refresh public OSF access metrics'
            git push origin HEAD:main
          fi
