name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # Daily publication-metrics refresh; keep other push deployments manual.
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test publication metric refresh
        run: node --test scripts/refresh-publication-metrics.test.mjs
      - name: Refresh public OSF access counts
        run: node scripts/refresh-publication-metrics.mjs
      - name: Retain last successful metrics
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- data/publication-metrics.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/publication-metrics.json
            git commit -m 'Refresh public OSF access metrics'
            git push origin HEAD:main
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
